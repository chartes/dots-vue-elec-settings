name: Validate config

on:
  push:
    branches:
      - dev
      - jsonld-metadata
      - fragment_search_xavier
  pull_request:
    branches:
      - dev
      - jsonld-metadata
      - fragment_search_xavier

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"
      - run: npm exec --package "https://github.com/dots-suite/dots-vue-config-validator" validate -- --generic-config custom.conf.json
      - run: |
          shopt -s extglob
          npm exec --package "https://github.com/dots-suite/dots-vue-config-validator" validate -- !(custom).conf.json
