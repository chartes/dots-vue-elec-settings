name: Validate config

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"
        # XXX: update package localisation when it's migrated
      - run: npm exec --package "https://github.com/xgaia/dots-vue-config-validator" validate *.conf.json
